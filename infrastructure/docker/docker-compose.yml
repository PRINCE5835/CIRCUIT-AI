version: "3.9"

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    volumes:
      - ../../backend:/app
    depends_on:
      ai-engine:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - breadboard-net

  ai-engine:
    build:
      context: ../../ai-engine
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ../../.env
    volumes:
      - ../../ai-engine:/app
      - model_data:/app/engine/models
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - breadboard-net

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - breadboard-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 10
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      ollama serve &
      sleep 3
      echo 'Pulling LLaVA 7B...'
      ollama pull llava
      echo 'Pulling Gemma3 2B...'
      ollama pull gemma3:2b
      echo 'Pulling DeepSeek Coder 1.3B...'
      ollama pull deepseek-coder:1.3b
      echo 'Models ready.'
      wait
      "

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - breadboard-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/sites:ro
    depends_on:
      - backend
    networks:
      - breadboard-net

volumes:
  model_data:
  ollama_data:
  redis_data:

networks:
  breadboard-net:
    driver: bridge
